# PRIVATE CONFIGURATION: contains secrets and API tokens. NEVER share this file,
# attach it to bug reports, commit it, or put it in a public/shared web folder.
# Copy to config.yaml. Share only after removing the first section. Restart after changes.

# Put IDs, secrets, and Windows paths (C:\tools\ffmpeg.exe) in single quotes.
# Relative paths are relative to this YAML file.

# Config schema v2ze

##################################
# NEVER SHARE THE SECTION BELOW! #
##################################
# API connections and secrets first. Blank Discord credentials disable the bot.
secrets:
  # The server password (access.password), at least 8 characters. Knowing it is
  # enough to get in, as a guest with a name of their own choosing; changing it
  # signs those guests out. Shorter hand-edited passwords block startup.
  server_password: ''

# MEDIA SOURCES: any number of Plex servers, Jellyfin servers and folders on this
# machine, all equal. Everyone admitted watches every library of every source
# through that source's own account; a source never lets anyone in by itself.
# Each entry has an id (quoted; letters, digits, dots, hyphens, underscores) that
# you keep for good and never reuse for another server, a type, an optional name
# shown on its libraries, and its type's settings. Order is the library order.
# Uncomment and fill in the ones you use. Restart after changes.
sources: []
#  - id: 'living-room'
#    type: 'plex'
#    name: '' # Optional; blank uses the name the server reports.
#    url: 'http://127.0.0.1:32400' # Reachable from this machine; no path.
#    token: '' # The Plex token uburoom reads this server with.
#    machine_identifier: '' # Blank: detect once and remember this server.
#    # Optional: the Plex section keys to offer, e.g. ['1', '4']. Leave it out to
#    # offer every library, including ones added later; with a list, a library
#    # added later stays off until you add its key. Server settings -> Sources
#    # writes this list when you switch libraries on or off.
#    libraries: ['1', '4']
#    # proxy: media goes through uburoom. auto: supported browsers fetch original
#    # files and Plex HLS straight from Plex (Activity stays proxied), with the
#    # proxy as recovery. Browsers then get tokens derived from direct_token, so
#    # auto needs a dedicated account and everyone watches what it can see.
#    delivery: 'proxy' # proxy | auto
#    client_url: '' # Required for auto: viewer-reachable HTTPS Plex origin, no path.
#    lan_client_url: '' # Optional LAN HTTPS Plex origin override; blank auto-detects.
#    # Required for auto, unused otherwise: a dedicated Plex account with access to
#    # your libraries that does not own the server (checked against plex.tv); NEVER
#    # token above. To get it, sign in at https://app.plex.tv as that account in a
#    # private window, press F12 and type localStorage.myPlexAccessToken in the
#    # console. It is a password; paste it only here. Signing that browser out stops
#    # it working, and this source's media is unavailable until you replace it.
#    direct_token: ''
#    # Report playback to the viewer's own Plex account, for verified Plex sign-ins
#    # that can reach this server. Others (guests included) are never reported.
#    reporting_enabled: true # Now-playing activity.
#    reporting_watch_state: true # Let viewers opt in to resume/watched sync.
#
#  # Seen through one Jellyfin user: everyone admitted sees what that user may
#  # see. Original files play as they are and uburoom converts the rest itself
#  # (needs FFmpeg); Jellyfin does not transcode.
#  - id: 'jellyfin'
#    type: 'jellyfin'
#    url: 'http://127.0.0.1:8096' # Including any base path.
#    api_key: '' # Jellyfin Dashboard -> API Keys.
#    user: '' # A Jellyfin username; give it only the libraries people may watch here.
#    # Let viewers who signed in to this Jellyfin opt in to resume/watched sync on
#    # their own Jellyfin user. Nobody else's playback is ever reported.
#    reporting_watch_state: true
#    # Optional: the Jellyfin library ids to offer, as for Plex; leave it out to
#    # offer every library the user can see. Server settings -> Sources writes it.
#    libraries: ['0123456789abcdef0123456789abcdef']
#
#  # Folders of videos on this machine (needs FFprobe, and FFmpeg for files a
#  # browser cannot play as they are). Each library: a short id, the name shown,
#  # and one or more folders (subfolders included), listed together as one library.
#  # Keep library ids (unique across all folders sources) and the source id for
#  # good: queues and resume positions are recorded under them and a file's place
#  # inside its folder, so folders can move but a changed id forgets them. When
#  # two folders hold the same file at the same place, the first listed is used.
#  # parse_names (default true) reads release names as a film's title and year:
#  # 65.2023.2160p.BluRay.x265-GROUP.mkv shows as "65" (2023); false shows the
#  # file name. type is 'movies' (default) or 'shows': a shows library groups files
#  # named like Show.S01E02.mkv (or Show/Season 1/02 - Title.mkv) into shows,
#  # seasons and episodes.
#  - id: 'local'
#    type: 'folders'
#    libraries:
#      - id: 'films'
#        name: 'Films'
#        paths: ['D:\Media\Films', 'E:\Films']
#        parse_names: true
#      - id: 'tv'
#        name: 'TV'
#        type: 'shows'
#        paths: ['D:\Media\TV']
#
#  # YouTube links & playlists via built-in yt-dlp rolling cache and/or IFrame embed
#  # (default 'auto' uses yt-dlp cache first for full sync & Web Audio and falls back to IFrame embed).
#  - id: 'youtube'
#    type: 'youtube'
#    name: 'YouTube'
#    delivery: 'auto' # 'auto' (yt-dlp cache + IFrame fallback), 'ytdlp' (cache only), or 'embed' (IFrame only).
#    max_cache_gb: 20 # LRU disk cache ceiling in GB (0.1 - 2000).
#    api_key: '' # Optional YouTube Data API v3 key for fast metadata, playlists in embed mode, and embeddable checks.
#    cache_directory: '' # Defaults to <data_directory>/youtube-cache.
#    yt_dlp: '' # Blank searches PATH; or explicit path to yt-dlp executable.
#    cookies_file: '' # Optional cookies.txt path for yt-dlp.
#    po_token_url: '' # Optional bgutil PO token HTTP provider URL.

discord:
  bot_token: ''
  client_id: ''
  client_secret: ''
  owner_id: ''
  excluded_guild_ids: [] # Quoted server IDs whose members cannot use that server for entry.
  command_channel_ids: [] # e.g. ['123456789012345678']
  share_channel_id: '' # One text channel for explicit room publication; blank disables it.
  rich_presence: true # Allow opted-in Discord Activity viewers to publish personal Rich Presence.

storage:
  data_directory: 'data' # Persist this directory across container replacements.

  # Outside the project. Preserve the EXACT original key for existing data.
  # Windows: %LOCALAPPDATA%/uburoom/credentials.key
  # Linux: ~/.local/share/uburoom/credentials.key (or XDG_DATA_HOME)
  # macOS: ~/Library/Application Support/uburoom/credentials.key
  credential_key_file: ''
##################################
# NEVER SHARE THE SECTION ABOVE! #
##################################

# Access and authorization
operator:
  # Who may open Server settings: exact verified identities written provider:id,
  # never names, emails or tokens. Any one listed is enough; none grants nobody.
  # Separate from the Discord owner, room Admin mode and room ownership.
  # e.g. ['discord:123456789012345678', 'plex:12345678', 'uburoom:alice'];
  # a Jellyfin user is 'jellyfin:<server id>:<user id>'.
  identities: []

access:
  # Entry rules: who gets in. Any one that matches is enough, and everyone let in
  # can watch every library of every media source. Each sign-in button is shown
  # only for a rule that needs it. Turn on at least one. Outside visitors can also
  # come in through a room invite (see guests below).
  discord_server: true # Members of eligible servers the bot has joined, signing in with Discord.
  source_members: [] # Plex or Jellyfin source IDs whose server members may come in, e.g. ['living-room']:
  # for a Plex source, people whose Plex account can reach that server.
  password: false # Anyone who knows secrets.server_password, as a named guest.
  accounts: false # uburoom's own accounts.

# Application settings
server:
  host: '127.0.0.1' # Containers: '0.0.0.0'; publish the desired port explicitly.
  port: 5756
  public_url: 'https://localhost:5756' # Public HTTPS origin, without a path.
  # Optional LAN HTTPS access alongside public_url:
  # '' (off), 'auto' (trust this machine's LAN IP/hostname on server.port in https mode),
  # or an explicit HTTPS origin (e.g. 'https://192.168.1.10:5756' for Docker or a local proxy).
  # Discord and Plex sign-in bounce through public_url's single callback via a one-time handoff;
  # shared invite links and password-set links continue to use public_url.
  lan_url: ''
  public_web_app: true # set false for Discord Activity only
  max_connections: 256 # Open room connections (one per browser tab or app) the server accepts at once.
  # Reverse proxies allowed to supply the viewer's IP address (quoted IPv4/IPv6
  # addresses or CIDRs, e.g. ['127.0.0.1', '::1'] or ['172.16.0.0/12']).
  # [] trusts no proxy and uses the direct socket address.
  trusted_proxies: []
  # Header read when the connection comes from a trusted proxy:
  # x-forwarded-for | cf-connecting-ip | x-real-ip
  trusted_proxy_header: 'x-forwarded-for'
  # https: uburoom serves HTTPS itself with the certificate below.
  # http-proxy: plain HTTP for a proxy or tunnel that serves public_url over
  # HTTPS (Cloudflare Tunnel, Tailscale, Caddy; docs/remote-access.md). Only
  # trusted_proxies may connect (required), the proxy must send
  # X-Forwarded-Proto: https, and no certificate is read. public_url stays HTTPS.
  listen: 'https' # https | http-proxy
  tls_cert: 'certs/server-cert.pem'
  tls_key: 'certs/server-key.pem'
tools:
  # Blank searches the runtime user's PATH on Windows, Linux and macOS.
  # Explicit paths override PATH; relative paths resolve beside this YAML file.
  # Needed for subtitle extraction and optional AV1/VP9/VP8 conversion.
  ffmpeg: ''
  ffprobe: '' # Searches PATH first, then defaults beside the selected ffmpeg.

# Logging behavior
logging:
  level: 'info' # error | warn | info | debug
  requests: true # log incoming HTTP requests (skips static assets unless error/debug)
  file: '' # Optional log file path, e.g. 'data/uburoom.log' (relative to this YAML file)

# Playback diagnostics: one file per day in the data folder's diagnostics folder, with
# server log lines and each viewer's player events (no links or sign-in details).
diagnostics:
  enabled: true # keep diagnostics on this server; viewers are told in the privacy notice
  keep_days: 7 # delete days older than this (1-365)
  max_mb: 500 # delete the oldest days when the folder grows past this

# Rooms and permissions
rooms:
  max_saved: 50
  max_open: 5
  min_retained: 10 # Inactivity deletion stops here; empty disposable rooms can still be deleted.
  inactive_days: 180 # 0 disables inactivity deletion.
  max_members: 20 # Leaders may choose a lower per-room limit.
  max_people: 100 # Connected people, including the lobby; counted once per account.
  recovery_seconds: 60
  max_queue: 50 # Upcoming items; Now playing is separate.
  max_history: 150 # Oldest history is removed first; 0 keeps no history.

  # Set initial room permissions.
  # Leave blank for defaults: hosts all except deletion/addHosts; viewers playPause and suggestMedia.
  # [] or 'none' grants none; 'all' grants all eligible rights.
  # Creators have all perms; hosts inherit from viewers; viewers can't get management perms.
  # Names: playPause, seek, chooseMedia, addQueue, suggestMedia, editQueue, autoplay,
  # roomSettings, closeRoom, deleteRoom, continueWithoutHost, addHosts, kickParticipants, announce, runPolls
  host_permissions: [playPause, seek, chooseMedia, addQueue, suggestMedia, editQueue, autoplay, roomSettings, closeRoom, continueWithoutHost, kickParticipants, announce, runPolls]
  viewer_permissions: [playPause, suggestMedia]

  # Exact identities ('discord:<id>', 'plex:<id>', 'uburoom:<subject>', 'jellyfin:<server id>:<user id>')
  # or provider IDs / guild role IDs; admins can toggle Admin mode.
  # Admin mode grants full permissions in every room.
  admin_identities: []
  admin_discord_ids: []
  admin_plex_ids: []
  admin_discord_role_ids: []

  # Trusted members sit between admins and everyone else. Same kind of exact identities/IDs.
  # Trusted grants no Admin mode, room rights, entry or Plex access by itself;
  # today it only matters for guests.issuers below.
  trusted_identities: []
  trusted_discord_ids: []
  trusted_plex_ids: []
  trusted_discord_role_ids: []

  # Enable single room to remove the ability to create and join rooms.
  # This means your uburoom will only have one shared queue.
  single_room: false # No create/delete/transfer.
  pause_on_buffering: false # Default for rooms that have no override. Pause everyone when an active viewer buffers.
  # Optional verified identity for the fixed room leader (same format as operator.identities),
  # or blank to use operator.identities[0] / discord.owner_id / Plex token owner.
  single_room_leader: ''
  # Optional Plex account ID for the fixed room leader (legacy alternative to single_room_leader).
  single_room_leader_plex_id: ''

# Every room has an invite link and code (like ubumfa-ogdave) that anyone in it can
# share. People who can already get in use it to reach the room, including private
# rooms. Hosts can also turn on "Allow guests" so the invite lets in people who
# can't otherwise get in. Guests are always plain participants, never hosts, and
# only see that room. Like anyone admitted, they can watch every library.
guests:
  enabled: false # Allow rooms to turn on guests at all.
  default_allow: true # Newly created rooms allow guests by default when guests are enabled.
  # Lowest server tier that may turn on guests in a room they host:
  # operator | admins | trusted | members. Higher tiers are included.
  issuers: 'admins'
  # true: every guest must sign in with Discord or Plex (their name is verified).
  require_sign_in: false
  max_per_room: 10 # Most guests in one room at once (1-50).
  session_hours: 24 # How long a guest stays signed in before re-entering the code (1-720).

# Scheduled watch nights belong to a room and show in the lobby. Posting one to
# Discord is optional and needs the bot's Create Events permission.
events:
  # Lowest server tier that may schedule: operator | admins | trusted | members.
  # Higher tiers are included. Changing an existing room's events also needs
  # hosting that room.
  schedulers: 'trusted'

# Show never-signed-in Discord members in authorized room host search.
# Discord discovery/presence also need the matching privileged bot intents enabled.
directory:
  expose_discord_members: true

# Transcoding behavior
transcoding:
  # These apply to every media source.
  # follow_provider: honors the media server's own setting (Plex can forbid video conversion)
  # disabled: no conversion paths
  # override: allows regardless of the media server's setting
  policy: 'follow_provider' # follow_provider | disabled | override
  # Tried in order when a viewer needs conversion. Leave one out to disable it.
  # Use av1, vp9, vp8 and provider. 'provider' is the media server's own transcoder;
  # only Plex has one, so it is skipped for Jellyfin and local folders. AV1 goes first
  # only with a working hardware encoder unless it is the last choice. [] disables conversion.
  outputs: [av1, provider]
  # Allow UbuPlayer WebCodecs/AudioWorklet/OffscreenCanvas client playback and local file demuxing.
  ubuplayer: true

  # Settings are for the uburoom encoder. Plex controls its own.
  # Software encoders: libsvtav1 (AV1), libvpx-vp9 (VP9), libvpx (VP8).
  # NVENC can only do AV1; Intel QSV can do AV1/VP9/VP8; software does all three.
  encoder: 'auto' # auto | hardware | qsv | nvenc | software
  cpu_fallback: true
  # Decode and scale on the GPU for every source. Falls back to the CPU if it fails.
  hardware_decode: true

  # AV1, VP9 and VP8 are the codecs that work in Discord with HW acceleration off.
  max_jobs: 5 # Total jobs; viewers at same quality share a job, qualities of one source share a chunk's job

  # Optional room fallback, encoded by uburoom within the same job/memory limits.
  # Kept 30 seconds ahead; idle while paused or empty. Viewers fetch it only
  # for a low buffer, a join or a reconnect. Uses default audio, no Burn-in.
  fallback:
    enabled: false
    height: 720
    bitrate: 2 # Mbps

  # Each pair is [maximum height, Mbps]. No upscaling. Original is separate,
  # and the highest entry here caps converted Original (Maximum).
  allow_original: true
  qualities: [[1080, 20], [1080, 12], [1080, 8], [720, 4], [720, 2]]
