# PRIVATE CONFIGURATION: contains secrets and API tokens. NEVER share this file,
# attach it to bug reports, commit it, or put it in a public/shared web folder.
# Copy to config.yaml. Share only after removing the first section. Restart after changes.

# Put IDs, secrets, and Windows paths (C:\tools\ffmpeg.exe) in single quotes.
# Relative paths are relative to this YAML file.

# Config schema v2l

##################################
# NEVER SHARE THE SECTION BELOW! #
##################################
# API connections and secrets first. Blank Discord credentials disable the bot.
secrets:
  entry_password: '' # Optional extra password, in addition to provider requirements.

plex:
  url: 'http://127.0.0.1:32400'
  token: ''
  machine_identifier: '' # Leave blank to detect and remember your Plex server.
  # Original files and Plex HLS in supported browsers; Activity remains proxied.
  delivery: 'proxy' # proxy | auto (prefer direct, recover through the proxy)
  client_url: '' # Required for auto: viewer-reachable HTTPS Plex origin, no path.
  lan_client_url: '' # Optional LAN HTTPS Plex origin override; blank auto-detects from Plex.

  # SHARING: enabled by default. Viewers without a Plex account or confirmed
  # server membership can access the fallback account's libraries and media.
  # This can grant more media access than their personal account has.
  # Expired/revoked credentials, outages and item denials NEVER use fallback.
  fallback_enabled: true
  # Blank uses token above. Prefer a dedicated account that has access to your
  # libraries but does not own the server. To get its token: open a private
  # browser window, sign in at https://app.plex.tv as that account, press F12,
  # and type localStorage.myPlexAccessToken in the console.
  # Cautions: the token is a password, so paste it only here. It belongs to that
  # browser sign-in: signing that browser out, or removing its device from the
  # account's Plex devices, stops the token working and sharing quietly fails.
  fallback_token: ''
  # Direct sharing NEVER uses token above. Requires a dedicated Plex account
  # with library access but no server ownership, verified against plex.tv.
  direct_fallback_enabled: false

  # REPORTING: report active playback and watch progress for verified Plex accounts.
  # Viewers without personal Plex access (sponsored/guests) are never reported.
  reporting_enabled: true # Enable timeline activity reporting to Plex.
  reporting_watch_state: true # Allow personal watch-state (resume/scrobble) synchronization.

discord:
  bot_token: ''
  client_id: ''
  client_secret: ''
  owner_id: ''
  guild_id: ''
  command_channel_ids: [] # e.g. ['123456789012345678']

storage:
  data_directory: 'data' # Persist this directory across container replacements.

  # Outside the project. Preserve the EXACT original key for existing data.
  # Windows: %LOCALAPPDATA%/uburoom/credentials.key
  # Linux: ~/.local/share/uburoom/credentials.key (or XDG_DATA_HOME)
  # macOS: ~/Library/Application Support/uburoom/credentials.key
  credential_key_file: ''
##################################
# NEVER SHARE THE SECTION ABOVE! #
##################################

# Access and authorization
operator:
  # Exact provider account IDs, never names, emails or tokens. Blank grants none.
  # Either configured identity must be verified on the signed-in account.
  # Separate from Discord owner, room Admin mode/ownership and Plex media access.
  discord_id: ''
  plex_id: ''

access:
  # Choose sign-in methods. Both false allows anonymous guests (not guest passes).
  # Discord sign-in requires guild membership. Plex proves the account identity.
  discord: true
  plex: true
  # Require confirmed personal access to THIS Plex server, before any entry.
  # Fallback and the entry password do not count as Plex authorization.
  require_plex: false
  # Set false to let Discord Activities skip the Plex requirement above.
  require_plex_in_activity: true

# Application settings
server:
  host: '127.0.0.1' # Containers: '0.0.0.0'; publish the desired port explicitly.
  port: 5756
  public_url: 'https://localhost:5756' # Public HTTPS origin, without a path.
  public_web_app: true # set false for Discord Activity only
  tls_cert: 'certs/server-cert.pem'
  tls_key: 'certs/server-key.pem'
tools:
  # Blank searches the runtime user's PATH on Windows, Linux and macOS.
  # Explicit paths override PATH; relative paths resolve beside this YAML file.
  # Needed for subtitle extraction and optional AV1/VP9/VP8 conversion.
  ffmpeg: ''
  ffprobe: '' # Searches PATH first, then defaults beside the selected ffmpeg.

# Logging behavior
logging:
  level: 'info' # error | warn | info | debug
  requests: true # log incoming HTTP requests (skips static assets unless error/debug)
  file: '' # Optional log file path, e.g. 'data/uburoom.log' (relative to this YAML file)

# Playback diagnostics: one file per day in the data folder's diagnostics folder, with
# server log lines and each viewer's player events (no links or sign-in details).
diagnostics:
  enabled: true # keep diagnostics on this server; viewers are told in the privacy notice
  keep_days: 7 # delete days older than this (1-365)
  max_mb: 500 # delete the oldest days when the folder grows past this

# Rooms and permissions
rooms:
  max_saved: 50
  max_open: 5
  min_retained: 10 # Inactivity deletion stops here; empty disposable rooms can still be deleted.
  inactive_days: 180 # 0 disables inactivity deletion.
  max_members: 20 # Leaders may choose a lower per-room limit.
  max_people: 100 # Connected people, including the lobby; counted once per account.
  recovery_seconds: 60
  max_queue: 50 # Upcoming items; Now playing is separate.
  max_history: 150 # Oldest history is removed first; 0 keeps no history.

  # Set initial room permissions.
  # Leave blank for defaults: hosts all except deletion/addHosts; viewers only playPause.
  # [] or 'none' grants none; 'all' grants all eligible rights.
  # Creators have all perms; hosts inherit from viewers; viewers can't get management perms.
  # Names: playPause, seek, chooseMedia, addQueue, editQueue, autoplay,
  # roomSettings, closeRoom, deleteRoom, continueWithoutHost, addHosts, kickParticipants
  host_permissions: [playPause, seek, chooseMedia, addQueue, editQueue, autoplay, roomSettings, closeRoom, continueWithoutHost, kickParticipants]
  viewer_permissions: [playPause]

  # Exact provider IDs / guild role IDs; admins can toggle Admin mode.
  # Admin mode grants full permissions in every room.
  admin_discord_ids: []
  admin_plex_ids: []
  admin_discord_role_ids: []

  # Trusted members sit between admins and everyone else. Same kind of exact IDs.
  # Trusted grants no Admin mode, room rights, entry or Plex access by itself;
  # today it only matters for guests.issuers below.
  trusted_discord_ids: []
  trusted_plex_ids: []
  trusted_discord_role_ids: []

  # Enable single room to remove the ability to create and join rooms.
  # This means your uburoom will only have one shared queue.
  single_room: false # No create/delete/transfer.
  # Optional Plex account ID for the fixed room leader.
  # Blank: Discord owner if Discord sign-in is on; otherwise the Plex token account.
  # With both sign-in methods off, the Discord owner stays the leader.
  single_room_leader_plex_id: ''

# Every room has an invite link and code (like ubumfa-ogdave) that anyone in it can
# share. People who can already get in use it to reach the room, including private
# rooms. Hosts can also turn on "Allow guests" so the invite lets in people who
# can't otherwise get in. Guests are always plain participants, never hosts, and
# only see that room. Without their own Plex access they watch through
# plex.fallback_enabled sharing.
guests:
  enabled: false # Allow rooms to turn on guests at all.
  # Lowest server tier that may turn on guests in a room they host:
  # operator | admins | trusted | members. Higher tiers are included.
  issuers: 'admins'
  # true: every guest must sign in with Discord or Plex (their name is verified).
  # Required when access.require_plex is true.
  require_sign_in: false
  max_per_room: 10 # Most guests in one room at once (1-50).
  session_hours: 24 # How long a guest stays signed in before re-entering the code (1-720).

# Show never-signed-in provider members in authorized room host search.
# Discord discovery/presence also need the matching privileged bot intents enabled.
directory:
  expose_discord_members: true
  expose_plex_members: false # Requires the configured Plex server owner's token.

# Transcoding behavior
transcoding:
  # follow_plex: honors Plex's setting
  # disabled: no conversion paths
  # override: allows regardless of Plex's setting
  policy: 'follow_plex' # follow_plex | disabled | override
  # Tried in order when a viewer needs conversion. Leave one out to disable it.
  # Use av1, vp9, vp8 and plex. AV1 goes first only with a working hardware encoder
  # unless it is the last choice. [] disables conversion.
  outputs: [av1, plex]

  # Settings are for the uburoom encoder. Plex controls its own.
  # Software encoders: libsvtav1 (AV1), libvpx-vp9 (VP9), libvpx (VP8).
  # NVENC can only do AV1; Intel QSV can do AV1/VP9/VP8; software does all three.
  encoder: 'auto' # auto | qsv | nvenc | software
  cpu_fallback: true
  # Decode and scale on the GPU for every source. Falls back to the CPU if it fails.
  hardware_decode: true

  # AV1, VP9 and VP8 are the codecs that work in Discord with HW acceleration off.
  max_jobs: 5 # Total jobs; viewers at same quality share a job

  # Optional room fallback, encoded by uburoom within the same job/memory limits.
  # Kept 30 seconds ahead; idle while paused or empty. Viewers fetch it only
  # for a low buffer, a join or a reconnect. Uses default audio, no Burn-in.
  fallback:
    enabled: false
    height: 720
    bitrate: 2 # Mbps

  # Each pair is [maximum height, Mbps]. No upscaling. Original is separate.
  allow_original: true
  qualities: [[1080, 20], [1080, 12], [1080, 8], [720, 4], [720, 2]]
