<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101217" />
    <meta name="darkreader-lock" />
    <meta name="robots" content="noindex" />
    <title>uburoom control gallery (development)</title>
    <link rel="preload" href="/assets/fonts/UburoomSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The shipped scripts and stylesheets, in the watch page's order. -->
    <script src="/icons.js"></script>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/watch.css" />
    <link rel="stylesheet" href="/watch-player.css" />
    <link rel="stylesheet" href="/watch-library.css" />
    <link rel="stylesheet" href="/watch-queue.css" />
    <link rel="stylesheet" href="/vendor/overlayscrollbars/overlayscrollbars.css" />
    <link rel="stylesheet" href="/watch-scrollbars.css" />
    <!-- Gallery layout only: grid and positions, never a control's look. -->
    <link rel="stylesheet" href="/__dev/gallery.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <script src="/watch-popover.js"></script>
    <script src="/watch-dialogs.js"></script>
    <script src="/watch-controls.js"></script>
    <script src="/watch-toasts.js"></script>
    <script src="/__dev/gallery.js" defer></script>
  </head>
  <body>
    <svg id="icon-sprite" hidden aria-hidden="true" width="0" height="0"></svg>
    <main class="gallery">
      <header class="gallery-header">
        <img class="brand" src="/assets/branding/uburoom-wordmark-brand.svg" alt="uburoom" width="164" height="51" />
        <h1>Control gallery</h1>
        <button
          id="theme-toggle"
          aria-label="Theme: Dark. Switch to light."
          title="Theme: Dark. Switch to light."
          class="appearance-toggle"
          type="button"
          role="switch"
          aria-checked="false"
        >
          <span class="appearance-track" aria-hidden="true"><span class="appearance-thumb"></span></span>
        </button>
      </header>
      <p class="hint">
        Development only. Shared controls built by the shipped helpers and styled only by the shipped stylesheets. Hover
        cannot be shown statically; focus is shown on one control.
      </p>
      <div id="gallery"></div>
    </main>
  </body>
</html>
