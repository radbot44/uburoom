<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101217"><title>uburoom native authorization</title><script src="/theme.js"></script><link rel="stylesheet" href="/watch.css"><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any"></head>
<body><main class="handoff-page"><header class="account"><a href="/watch" aria-label="uburoom watch"><img class="brand" src="/assets/branding/uburoom-wordmark-brand.svg" alt="uburoom" width="164" height="51"></a></header>
<section class="card"><h1>Authorize Plezy Companion</h1><p id="native-message" role="status">Checking authorization code…</p><button id="native-approve" class="primary" hidden>Authorize Plezy</button><p id="native-error" role="alert"></p><a id="native-login" href="/auth/discord" class="quiet handoff-login" hidden>Log in with Discord</a></section>
</main>
<script>
'use strict';
(async function() {
  const messageEl = document.getElementById('native-message');
  const approveBtn = document.getElementById('native-approve');
  const errorEl = document.getElementById('native-error');
  const loginLink = document.getElementById('native-login');
  const code = (window.location.hash || '').replace(/^#/, '').trim();
  if (!code) {
    messageEl.textContent = 'Missing authorization code. Start pairing from Plezy.';
    return;
  }
  try {
    const claimRes = await fetch('/api/watch/handoff/native/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    if (claimRes.status === 401) {
      messageEl.textContent = 'You must be signed in to authorize a companion client.';
      loginLink.hidden = false;
      return;
    }
    const claimData = await claimRes.json();
    if (!claimRes.ok) {
      errorEl.textContent = claimData.error || 'Failed to claim authorization code.';
      messageEl.textContent = '';
      return;
    }
    messageEl.textContent = 'Authorize Plezy to connect to uburoom as ' + (claimData.name || 'your account') + '?';
    approveBtn.hidden = false;
    approveBtn.addEventListener('click', async function() {
      approveBtn.disabled = true;
      messageEl.textContent = 'Authorizing Plezy…';
      try {
        const approveRes = await fetch('/api/watch/handoff/native/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: claimData.id })
        });
        const approveData = await approveRes.json();
        if (!approveRes.ok) {
          errorEl.textContent = approveData.error || 'Approval failed.';
          approveBtn.disabled = false;
          return;
        }
        approveBtn.hidden = true;
        messageEl.textContent = 'Plezy is now authorized! You can return to the app.';
      } catch (err) {
        errorEl.textContent = 'Network error during approval.';
        approveBtn.disabled = false;
      }
    });
  } catch (err) {
    errorEl.textContent = 'Failed to connect to the server.';
    messageEl.textContent = '';
  }
})();
</script>
</body></html>
