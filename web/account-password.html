<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>uburoom password</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles/all.css" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
  </head>
  <body>
    <main class="handoff-page">
      <header class="account">
        <a href="/" aria-label="uburoom"
          ><img class="brand" src="/assets/branding/uburoom-wordmark-brand.svg" alt="uburoom" width="164" height="51"
        /></a>
      </header>
      <section class="card">
        <h1 id="password-title">Set your password</h1>
        <p id="password-status" role="status">Checking link…</p>
        <form id="password-form" class="entry-form" hidden>
          <input id="password-username" type="text" autocomplete="username" hidden readonly />
          <label for="password-new">New password</label
          ><input
            id="password-new"
            class="entry-password"
            type="password"
            autocomplete="new-password"
            minlength="10"
            maxlength="1024"
            required
          /><label for="password-confirm">Confirm password</label
          ><input
            id="password-confirm"
            class="entry-password"
            type="password"
            autocomplete="new-password"
            minlength="10"
            maxlength="1024"
            required
          />
          <p class="hint">At least 10 characters.</p>
          <p id="password-error" class="form-error" role="alert"></p>
          <button id="password-submit" class="entry-submit primary" type="submit">Set password</button>
        </form>
        <a class="quiet handoff-login" href="/">Back to uburoom</a>
      </section>
    </main>
    <script type="module" src="/account-password.js"></script>
  </body>
</html>
